</style></head><body><main><span class="tag">AMIN OS / INTERACTIVE PREVIEW</span><h1>你的故事，仍在继续。</h1><p>右下角打开 Amin os。这里使用演示聊天与模拟回复，不连接真实模型，也不访问你的酒馆数据。</p><div class="preview-tools"><button id="preview-switch">切换演示聊天</button><button id="preview-group">切换群聊模式</button><button id="preview-empty">清空演示状态</button></div><div id="chat"><article class="mes" mesid="0"><small>旅人</small><p>我停在观测站门前，看向那片亮着微光的星海。</p></article><article class="mes" mesid="1"><small>向导</small><p>“雨快停了。”她收起伞，指了指山脊上的旧路，“如果现在出发，我们还能赶上日落。”</p></article></div><form id="send_form" onsubmit="return false"><label for="send_textarea">聊天输入框 · 候选会填到这里</label><textarea id="send_textarea" placeholder="写下你的下一句话…"></textarea></form></main><script type="module" src="preview.js"></script></body></html>
